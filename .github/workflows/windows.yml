# Builds the Windows version on a GitHub Windows runner and publishes it as a release:
#   Moonbase-windows.zip          the app, DECtalk and the speech model (runs on the CPU)
#   Moonbase-windows-GPU-pack.zip NVIDIA's CUDA/cuDNN DLLs and ONNX Runtime's CUDA plugin, unzipped on top
# Two zips because a release file can be at most 2 GiB.
# Everything fetched is pinned: actions by commit, DECtalk by commit, Python packages and the model by hash.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # publish the release

env:
  DECTALK_COMMIT: 986ea12ec8dac85881394d7bd7daf1f1d5098b9a
  MODEL: sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-fp16
  MODEL_SHA256: 37f67a1a6c942dae27d345ee395fbd19e25ee48996faf70fca25779026054cf0
  # VB-Audio Virtual Cable's package, shipped unmodified (allowed by vb-audio.com/Services/licensing.htm)
  VBCABLE: VBCABLE_Driver_Pack46.zip
  VBCABLE_SHA256: bc44e8974191a5a2427d6c979e2dab08dbb09925f3f435dfa2f0ba3e45b6eb90

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch DECtalk source (pinned commit)
        shell: bash
        run: |
          git init -q dectalk-src
          git -C dectalk-src fetch -q --depth 1 https://github.com/dectalk/dectalk.git "$DECTALK_COMMIT"
          git -C dectalk-src checkout -q FETCH_HEAD
          test "$(git -C dectalk-src rev-parse HEAD)" = "$DECTALK_COMMIT"

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Build DECtalk (64-bit, US English), as dectalk/dectalk's own CI does
        shell: cmd
        working-directory: dectalk-src/src
        run: MSBuild.exe DECtalk.sln /m /p:Configuration="Release - ENGLISH_US" /p:Platform="AMD64"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python packages (pinned by hash)
        run: python -m pip install --require-hashes --no-deps -r packaging/windows/requirements.txt

      - name: Download the speech model (pinned by hash)
        shell: bash
        run: |
          curl -fsSL --retry 3 -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$MODEL.tar.bz2"
          echo "$MODEL_SHA256  model.tar.bz2" | sha256sum -c
          mkdir -p models
          tar -xjf model.tar.bz2 -C models "$MODEL/encoder.fp16.onnx" "$MODEL/decoder.fp16.onnx" "$MODEL/joiner.fp16.onnx" "$MODEL/tokens.txt"
          rm model.tar.bz2

      - name: Package the app (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name Moonbase --icon icon.ico
          --add-data "icon.png;." --collect-all sherpa_onnx --hidden-import lameenc
          --exclude-module audio_linux app.py

      - name: Assemble the app folder
        shell: bash
        run: |
          set -e
          app=dist/Moonbase
          mkdir -p "$app/dectalk" "$app/models" "$app/vbcable"
          cp "dectalk-src/src/dapi/build/dectalk/x64/Release - ENGLISH_US/DECtalk.dll" "$app/dectalk/"
          cp "dectalk-src/src/dapi/build/dic/x64/Release - ENGLISH_US/dtalk_us.dic" "$app/dectalk/"
          mv "models/$MODEL" "$app/models/"
          cp packaging/windows/README.txt "$app/README.txt"
          curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$app/vbcable/$VBCABLE" "https://download.vb-audio.com/Download_CABLE/$VBCABLE"
          echo "$VBCABLE_SHA256  $app/vbcable/$VBCABLE" | sha256sum -c
          # the CUDA plugin goes in the GPU pack, at the same place
          plugin=_internal/sherpa_onnx/lib/onnxruntime_providers_cuda.dll
          find "$app" -iname "onnxruntime*.dll"
          test -f "$app/$plugin"
          mkdir -p "gpu/Moonbase/$(dirname "$plugin")" gpu/Moonbase/cuda
          mv "$app/$plugin" "gpu/Moonbase/$plugin"

      - name: GPU pack (NVIDIA's DLLs from their pinned wheels)
        shell: bash
        run: |
          set -e
          python -m pip download --require-hashes --no-deps --only-binary :all: -r packaging/windows/requirements-gpu.txt -d gpu-wheels
          python - <<'EOF'
          import glob, os, zipfile
          for w in glob.glob("gpu-wheels/*.whl"):
              with zipfile.ZipFile(w) as z:
                  for n in z.namelist():
                      if n.lower().endswith(".dll") and "/bin/" in n:
                          with open(os.path.join("gpu/Moonbase/cuda", os.path.basename(n)), "wb") as f:
                              f.write(z.read(n))
          print(sorted(os.listdir("gpu/Moonbase/cuda")))
          EOF
          rm -rf gpu-wheels
          for dll in cublas64_12 cublasLt64_12 cudart64_12 cudnn64_9 cufft64_11; do test -f "gpu/Moonbase/cuda/$dll.dll"; done

      - name: Self-test the packaged app (DECtalk, recognition on the CPU, MP3; there are no audio devices here)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Moonbase\Moonbase.exe -ArgumentList "--selftest", "$pwd\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        shell: bash
        run: |
          set -e
          (cd dist && 7z a -tzip -mx=5 ../Moonbase-windows.zip Moonbase > /dev/null)
          (cd gpu && 7z a -tzip -mx=5 ../Moonbase-windows-GPU-pack.zip Moonbase > /dev/null)
          for z in Moonbase-windows.zip Moonbase-windows-GPU-pack.zip; do
            size=$(stat -c %s "$z"); echo "$z: $((size / 1048576)) MiB"
            test "$size" -lt 2147483648     # GitHub's limit per release file
          done

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="windows-$GITHUB_RUN_NUMBER"
          { cat packaging/windows/README.txt; echo; echo "Self-test on the build machine:"; echo '```'; cat selftest.txt; echo '```'; } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "Moonbase for Windows ($tag)" --notes-file notes.md \
            Moonbase-windows.zip Moonbase-windows-GPU-pack.zip

      - name: Keep the self-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest
          path: |
            selftest.txt
            selftest.mp3
          if-no-files-found: ignore
